<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
     <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" />
     <meta http-equiv="Pragma" content="no-cache" />
     <meta http-equiv="Expires" content="-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Squad Shoes</title>
    <script>
      // Log imediato para depuração de cache
      console.log("App Inicializando...");
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          if (regs.length > 0) console.log("Service Workers ativos:", regs.length);
        });
      }

      // Recuperação de ENTRY chunk 404 (PWA/iOS).
      //
      // Após deploy, o HTML antigo (ainda na memória do Safari/PWA) aponta pra
      // /assets/index-<hash>.js que a Vercel já removeu do alias de produção.
      // O chunkErrorHandler vive DENTRO desse JS — se o entry 404, nada monta
      // e a tela fica branca pra sempre. Este listener roda no HTML cru e
      // força 1 reload com cache-bust + limpa SW, compartilhando o orçamento
      // `app-recovery-reload` com main.tsx / chunkErrorHandler / VersionChecker.
      (function () {
        var KEY = 'app-recovery-reload';
        var MAX = 2;
        var COOLDOWN = 10000;
        var EPISODE = 60000;

        function read() {
          try {
            var raw = sessionStorage.getItem(KEY);
            if (!raw) return { count: 0, lastTs: 0 };
            var p = JSON.parse(raw);
            if (typeof p.count === 'number' && typeof p.lastTs === 'number') return p;
          } catch (e) {}
          return { count: 0, lastTs: 0 };
        }

        function reserve() {
          var now = Date.now();
          var s = read();
          if (s.lastTs && now - s.lastTs > EPISODE) s = { count: 0, lastTs: 0 };
          if (s.lastTs && now - s.lastTs < COOLDOWN) return false;
          if (s.count >= MAX) return false;
          try {
            sessionStorage.setItem(KEY, JSON.stringify({ count: s.count + 1, lastTs: now }));
          } catch (e) {}
          return true;
        }

        function recover() {
          if (!reserve()) return;
          console.warn('[boot] Entry script falhou — recarregando HTML fresco');
          var go = function () {
            var url = new URL(location.href);
            url.searchParams.set('_r', String(Date.now()));
            location.replace(url.toString());
          };
          if (!('serviceWorker' in navigator)) {
            go();
            return;
          }
          navigator.serviceWorker.getRegistrations()
            .then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
            .catch(function () {})
            .then(go);
        }

        // capture=true: erro de <script src> não borbulha no bubble phase
        window.addEventListener('error', function (ev) {
          var t = ev && ev.target;
          if (!t || t.tagName !== 'SCRIPT') return;
          var src = String(t.src || '');
          if (src.indexOf('/assets/') !== -1 || src.indexOf('main.tsx') !== -1) {
            recover();
          }
        }, true);

        // Se nada montou em #root (entry 404 sem disparar error em alguns WebViews),
        // não auto-reload (rede lenta no celular daria falso positivo) — só UI nativa.
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childNodes.length > 0) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;font-family:system-ui,-apple-system,sans-serif;text-align:center">' +
            '<p style="margin:0;font-size:18px;font-weight:600">O app não carregou</p>' +
            '<p style="margin:0;font-size:14px;opacity:.7;max-width:28rem">Geralmente é cache antigo no celular após uma atualização. Toque para baixar a versão nova.</p>' +
            '<button type="button" id="squad-boot-reload" style="appearance:none;border:0;border-radius:8px;background:#C00000;color:#fff;font-size:16px;font-weight:600;padding:12px 20px">Atualizar agora</button>' +
            '</div>';
          var btn = document.getElementById('squad-boot-reload');
          if (btn) {
            btn.onclick = function () {
              try { sessionStorage.removeItem(KEY); } catch (e) {}
              recover();
            };
          }
        }, 12000);
      })();
    </script>
    <meta name="description" content="Sistema de gestão industrial completo para fábricas de calçados — produção, estoque, financeiro e mais." />
    <meta name="author" content="Squad Shoes" />

    <!-- Performance: Preconnect to font origins (limit to most important) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ⚠ NÃO reintroduzir `<link rel="modulepreload" href="/src/main.tsx">` aqui.
         O Vite não reescreve esse href pro chunk buildado: ele INLINA o fonte TSX
         cru como data: URI base64 no HTML de produção (~4,4 kB que o browser baixa
         e não consegue executar, além de vazar o fonte). O próprio Vite já injeta
         o modulepreload da entrada e dos vendor chunks automaticamente. -->

    <!-- PWA — iOS-specific meta tags (Apple ignora manifest.webmanifest pra
         alguns recursos como splash screens; precisa de tags próprias). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Squad Vendas" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#D9264E" />

    <!-- Critical CSS: Minimal variables to prevent FOUC during non-blocking CSS load -->
    <style>
      :root {
        --background: 210 20% 98%;
        --foreground: 220 25% 10%;
        --primary: 160 55% 24%;
      }
      body {
        background-color: hsl(210 20% 98%);
        color: hsl(220 25% 10%);
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }
    </style>

    <!-- Fontes REAIS do app (Industrial Editorial Pro): Anton (display) + Fira Sans
         (body) + Fira Code (mono) + Fraunces (serif de acento em styles-paper.css).
         Declaradas aqui, no HTML, de propósito: o @import equivalente vivia dentro de
         src/index.css e src/styles-paper.css, o que empurrava a descoberta da fonte pro
         3º salto da cascata (HTML → CSS bundle → CSS do Google → woff2). Do HTML o
         browser dispara na 1ª passada do preload scanner, em paralelo com o JS.
         ⚠ NÃO reintroduzir @import de fonte nos .css — vira requisição encadeada.
         ⚠ Esta lista é a fonte única: se mudar família aqui, atualize também
         tailwind.config.ts (fontFamily) e os tokens --font-* de src/index.css. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Fira+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap"
    />

    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="/print.css" media="print" />
    <!-- Leaflet CSS is now lazy-loaded by route components that need maps -->

    <meta property="og:title" content="Squad Shoes - Gestão Industrial" />
    <meta property="og:description" content="Sistema de gestão industrial completo para fábricas de calçados" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SquadShoes" />
    <meta name="twitter:image" content="/favicon.jpg" />

    <!-- Script: module type defers automatically -->
    <script type="module" src="/src/main.tsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
