project_id = "ssvxfoybzmjlypnipqzn"

# Tombstone gerenciado do antigo probe fiscal manual. A versão remota legada
# era verify_jwt=false e fazia proxy de metadados da ClickNotas sem autenticação.
# O handler atual não acessa provedor/segredos e responde 410; o gateway também
# exige JWT para impedir que chamadas anônimas cheguem ao runtime.
[functions.gc-probe-temp]
verify_jwt = true

[functions.emit-nfe]
verify_jwt = false

[functions.nfe-status]
verify_jwt = false

[functions.recolor-image]
verify_jwt = false

[functions.time-control]
verify_jwt = false

# Chamada pelo pg_cron (trigger_nfe_sync_cron, */30) SEM header Authorization —
# autentica via X-Cron-Secret (validado contra get_nfe_sync_cron_secret no
# handler) e tem fallback de JWT pra chamadas de usuário. Com verify_jwt=true
# (default) o GATEWAY derrubava o cron com 401 ANTES da função rodar (sync de NF
# parado, banco local atrás do ClickNotas). A função se protege sozinha.
[functions.sync-nfe-from-provider]
verify_jwt = false

# Mesma razão acima: chamada pelo pg_cron (trigger_sync_ar_cron, */30) via
# X-Cron-Secret (vault nfe_sync_cron_secret). A função valida o secret ou
# Bearer == service role key no handler — nunca roda anônima.
[functions.sync-ar]
verify_jwt = false

# Consumidor da outbox de PV disparado pelo pg_cron sem JWT. O handler valida
# X-Cron-Secret (vault nfe_sync_cron_secret) ou Bearer service-role.
[functions.process-sale-order-outbox]
verify_jwt = false
