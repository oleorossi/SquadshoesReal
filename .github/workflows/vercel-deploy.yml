name: Vercel Production Deploy

# Trigger: DEPOIS que o workflow "CI" passa em push pra main.
# Mudança em 2026-05-16: era `on: push: main`, rodava em paralelo com CI →
# Vercel deployava antes do tsc terminar. Erros tipo "Cannot find name 'Box'"
# (TS2304) caíam em prod porque vite build tolera TS errors silenciosamente.
# Agora a chain é: push → CI → (só se passou) → Vercel Deploy.
#
# Setup necessário (uma vez só):
# 1. https://vercel.com/account/tokens → Create Token → copia
# 2. Na pasta do projeto local: `npx vercel link` pra criar .vercel/project.json
#    Pega `orgId` e `projectId` do arquivo .vercel/project.json
# 3. GitHub Settings → Secrets and variables → Actions → New secret:
#    - VERCEL_TOKEN      = token do passo 1
#    - VERCEL_ORG_ID     = orgId do project.json
#    - VERCEL_PROJECT_ID = projectId do project.json

on:
  # Espera CI completar em push pra main. Se CI falhou, deploy é skipado
  # automaticamente (via `if:` no job abaixo). Branch filter garante que PRs
  # (que também rodam CI) NÃO disparem deploy prod.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Permite disparar manualmente em Actions tab (útil quando CI flaca por
  # razões não-relacionadas a código — ex: rede, runner indisponível).
  workflow_dispatch:

# Evita 2 deploys paralelos se vários pushes chegarem em sequência
concurrency:
  group: vercel-prod
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pula deploy se CI falhou. Manual dispatch ignora esse check (admin
    # decide quando forçar). workflow_run.conclusion pode ser:
    # success/failure/cancelled/skipped/timed_out — só deploya em success.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run roda no contexto da default branch mas precisamos do
          # SHA EXATO que disparou o CI (caso outros commits tenham chegado
          # entre o CI passar e esse job iniciar). github.sha cai no
          # workflow_dispatch case.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Diagnose secrets (sem expor valores sensíveis)
        env:
          TOK: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "== Secrets check =="
          if [ -z "$TOK" ]; then echo "❌ VERCEL_TOKEN ausente"; exit 1; fi
          echo "✅ VERCEL_TOKEN setado (length=${#TOK})"

          if [ -z "$VERCEL_ORG_ID" ]; then echo "❌ VERCEL_ORG_ID ausente"; exit 1; fi
          echo "✅ VERCEL_ORG_ID setado (prefix=${VERCEL_ORG_ID:0:10}...)"

          if [ -z "$VERCEL_PROJECT_ID" ]; then echo "❌ VERCEL_PROJECT_ID ausente"; exit 1; fi
          echo "✅ VERCEL_PROJECT_ID setado (prefix=${VERCEL_PROJECT_ID:0:10}...)"

          echo ""
          echo "== Vercel CLI whoami =="
          if vercel whoami --token=$TOK; then
            echo "✅ Token aceito pelo CLI"
          else
            echo "❌ Token rejeitado — verifique scope e validade"
            exit 1
          fi

          echo ""
          echo "== Project access check via API =="
          STATUS=$(curl -s -o /tmp/proj.json -w "%{http_code}" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $TOK")
          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Falha ao acessar projeto $VERCEL_PROJECT_ID via API"
            jq -r '.error.message // .' < /tmp/proj.json 2>/dev/null || cat /tmp/proj.json
            exit 1
          fi
          PROJECT_NAME=$(jq -r '.name' < /tmp/proj.json)
          echo "✅ Projeto encontrado: $PROJECT_NAME"

      - name: Setup Bun (for tsc gate)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps for tsc gate
        run: bun install --frozen-lockfile

      # Defesa em profundidade: re-roda tsc aqui antes de qualquer build/deploy.
      # Se workflow_dispatch foi usado pra bypass do CI, ou se algum bug deixou
      # vercel-deploy.yml ser triggered sem CI, esse gate ainda bloqueia.
      - name: TypeScript gate (bloqueia deploy se houver erro)
        run: bunx tsc --noEmit

      - name: Pull Vercel config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "🚀 Deploy concluído: $DEPLOY_URL"
          echo "## Deploy info" >> $GITHUB_STEP_SUMMARY
          echo "- URL: $DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: $DEPLOY_SHA" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
