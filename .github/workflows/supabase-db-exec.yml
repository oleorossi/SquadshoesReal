name: Supabase — Exec SQL file (Management API)

# ─────────────────────────────────────────────────────────────────────────────
# Executa UM arquivo .sql do repositório no banco Supabase via Management API
# (POST /v1/projects/{ref}/database/query) — o MESMO endpoint que o Supabase
# MCP usa. Serve de fallback quando a sessão não tem MCP e o supabase-migrate
# (db push) não é seguro por causa do backlog não registrado em
# supabase_migrations.schema_migrations.
#
# ⚠ Assim como o MCP, NÃO registra a migration em schema_migrations — mesma
# convenção das aplicações via MCP documentadas no CLAUDE.md.
#
# Disparo manual apenas (workflow_dispatch):
#   sql_path → caminho repo-relativo do .sql (ex.: supabase/migrations/x.sql)
#   strict   → 'true' (default) falha o job em qualquer HTTP != 2xx;
#              'false' só falha em 401/403 (útil pra scripts E2E que terminam
#              em RAISE EXCEPTION proposital pra forçar rollback — o relatório
#              vem no corpo da resposta de erro).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      sql_path:
        description: 'Caminho repo-relativo do arquivo .sql a executar'
        required: true
        type: string
      validation_sql_path:
        description: 'Opcional: teste SQL executado após o arquivo, na mesma transação (exige dry_run=true)'
        required: false
        type: string
      strict:
        description: 'Falhar em qualquer HTTP != 2xx?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      dry_run:
        description: 'Validar tudo em transação e finalizar com ROLLBACK?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: supabase-db-exec
  cancel-in-progress: false

jobs:
  exec:
    name: Exec SQL via Management API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID:   ${{ secrets.SUPABASE_PROJECT_ID }}
          SQL_PATH: ${{ inputs.sql_path }}
          VALIDATION_SQL_PATH: ${{ inputs.validation_sql_path }}
          STRICT:   ${{ inputs.strict }}
          DRY_RUN:  ${{ inputs.dry_run }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN não configurado}"
          : "${SUPABASE_PROJECT_ID:?SUPABASE_PROJECT_ID não configurado}"
          test -f "$SQL_PATH" || { echo "Arquivo não existe: $SQL_PATH"; exit 1; }
          if [ -n "$VALIDATION_SQL_PATH" ]; then
            test "$DRY_RUN" = "true" || { echo 'Teste complementar exige dry_run=true.'; exit 1; }
            test -f "$VALIDATION_SQL_PATH" || { echo "Teste não existe: $VALIDATION_SQL_PATH"; exit 1; }
          fi
          QUERY_PATH="$SQL_PATH"
          if [ "$DRY_RUN" = "true" ]; then
            QUERY_PATH=/tmp/supabase-dry-run.sql
            {
              echo 'BEGIN;'
              sed -E '/^[[:space:]]*BEGIN;[[:space:]]*$/d; /^[[:space:]]*COMMIT;[[:space:]]*$/d; /^[[:space:]]*ROLLBACK;[[:space:]]*$/d' "$SQL_PATH"
              if [ -n "$VALIDATION_SQL_PATH" ]; then
                sed -E '/^[[:space:]]*BEGIN;[[:space:]]*$/d; /^[[:space:]]*COMMIT;[[:space:]]*$/d; /^[[:space:]]*ROLLBACK;[[:space:]]*$/d' "$VALIDATION_SQL_PATH"
              fi
              echo 'ROLLBACK;'
            } > "$QUERY_PATH"
          fi
          echo "── Executando: $SQL_PATH ($(wc -c < "$SQL_PATH") bytes) · dry_run=$DRY_RUN"
          jq -Rs '{query: .}' < "$QUERY_PATH" > /tmp/body.json
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/body.json)
          echo "── HTTP $code — resposta:"
          cat /tmp/resp.json | head -c 20000
          echo
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "Token sem privilégio pro endpoint — abortando."; exit 1
          fi
          if [ "$STRICT" = "true" ] && { [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; }; then
            exit 1
          fi
