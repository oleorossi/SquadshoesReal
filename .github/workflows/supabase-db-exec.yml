name: Supabase — Exec SQL file (Management API)

# ─────────────────────────────────────────────────────────────────────────────
# Executa UM arquivo .sql do repositório no banco Supabase via Management API
# (POST /v1/projects/{ref}/database/query) — o MESMO endpoint que o Supabase
# MCP usa. Serve de fallback quando a sessão não tem MCP e o supabase-migrate
# (db push) não é seguro por causa do backlog não registrado em
# supabase_migrations.schema_migrations.
#
# ⚠ Assim como o MCP, NÃO registra a migration em schema_migrations — mesma
# convenção das aplicações via MCP documentadas no CLAUDE.md.
#
# Disparo manual apenas (workflow_dispatch):
#   sql_path → caminho repo-relativo do .sql (ex.: supabase/migrations/x.sql)
#   strict   → 'true' (default) falha o job em qualquer HTTP != 2xx;
#              'false' só falha em 401/403 (útil pra scripts E2E que terminam
#              em RAISE EXCEPTION proposital pra forçar rollback — o relatório
#              vem no corpo da resposta de erro).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      sql_path:
        description: 'Caminho repo-relativo do arquivo .sql a executar'
        required: true
        type: string
      strict:
        description: 'Falhar em qualquer HTTP != 2xx?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      dry_run:
        description: 'Validar tudo em transação e finalizar com ROLLBACK?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: supabase-db-exec
  cancel-in-progress: false

jobs:
  exec:
    name: Exec SQL via Management API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID:   ${{ secrets.SUPABASE_PROJECT_ID }}
          SQL_PATH: ${{ inputs.sql_path }}
          STRICT:   ${{ inputs.strict }}
          DRY_RUN:  ${{ inputs.dry_run }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN não configurado}"
          : "${SUPABASE_PROJECT_ID:?SUPABASE_PROJECT_ID não configurado}"
          SOURCE_PATH="$SQL_PATH"
          if [ "$SQL_PATH" = "@tiras-artesanais-ddl" ]; then
            SOURCE_PATH=/tmp/tiras-artesanais-ddl.sql
            : > "$SOURCE_PATH"
            for path in \
              supabase/migrations/20270101003000_artisanal_straps_catalog_core.sql \
              supabase/migrations/20270101003050_artisanal_straps_catalog_postdeploy_hardening.sql \
              supabase/migrations/20270101003100_artisanal_straps_operational_schema.sql \
              supabase/migrations/20270101003200_artisanal_straps_operational_engine.sql \
              supabase/migrations/20270101003300_artisanal_straps_legacy_migration_apply.sql
            do
              test -f "$path" || { echo "Arquivo não existe: $path"; exit 1; }
              sed -E '/^[[:space:]]*BEGIN;[[:space:]]*$/d; /^[[:space:]]*COMMIT;[[:space:]]*$/d' "$path" >> "$SOURCE_PATH"
            done
          else
            test -f "$SOURCE_PATH" || { echo "Arquivo não existe: $SOURCE_PATH"; exit 1; }
          fi
          QUERY_PATH="$SOURCE_PATH"
          if [ "$DRY_RUN" = "true" ]; then
            QUERY_PATH=/tmp/supabase-dry-run.sql
            {
              echo 'BEGIN;'
              sed -E '/^[[:space:]]*BEGIN;[[:space:]]*$/d; /^[[:space:]]*COMMIT;[[:space:]]*$/d' "$SOURCE_PATH"
              echo 'ROLLBACK;'
            } > "$QUERY_PATH"
          fi
          echo "── Executando: $SQL_PATH ($(wc -c < "$SOURCE_PATH") bytes) · dry_run=$DRY_RUN"
          jq -Rs '{query: .}' < "$QUERY_PATH" > /tmp/body.json
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/body.json)
          echo "── HTTP $code — resposta:"
          cat /tmp/resp.json | head -c 20000
          echo
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "Token sem privilégio pro endpoint — abortando."; exit 1
          fi
          if [ "$STRICT" = "true" ] && { [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; }; then
            exit 1
          fi
