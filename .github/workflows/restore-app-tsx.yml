name: restore-app-tsx

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore App.tsx from 2230a5b and mount vitrine route
        run: |
          set -euo pipefail
          git checkout 2230a5bc131e93084ff2491fbbd0cce2a6e48887 -- src/App.tsx
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          t = p.read_text()
          needle = 'import { clearStalePwaArtifacts } from "@/utils/pwa-utils";\n'
          if 'from "./router.public"' not in t:
              t = t.replace(needle, needle + 'import { publicVitrineRoute } from "./router.public";\n', 1)
          old = '  ...DESIGN_PREVIEW_ROUTES,\n  {\n    // Central de Produ\u00e7\u00e3o'
          new = '  ...DESIGN_PREVIEW_ROUTES,\n  publicVitrineRoute,\n  {\n    // Central de Produ\u00e7\u00e3o'
          if 'publicVitrineRoute,' not in t:
              if old not in t:
                  raise SystemExit('anchor not found in App.tsx')
              t = t.replace(old, new, 1)
          p.write_text(t)
          print('bytes', p.stat().st_size)
          PY
          git config user.email "oleorossi@outlook.com"
          git config user.name "oleorossi"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo 'no change'
            exit 0
          fi
          git commit -m "fix(pronta-entrega): restaurar App.tsx e montar /vitrine/:token"
          git push origin HEAD:main
