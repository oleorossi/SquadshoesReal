name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Critical: blocks merge if menu items diverge from the access-control
      # module map (prevents bugs like "Ajuste de Estoque" disappearing because
      # its route was admin-only while the menu showed it to all users).
      - name: Navigation ↔ Access Control consistency
        run: bunx vitest run src/__tests__/NavigationAccessConsistency.test.ts

      - name: Full test suite
        run: bun run test

      # Contratos do fluxo PV → ficha → estoque são estáticos e não precisam de
      # segredo. O banco vivo é validado no workflow semanal isolado.
      - name: PV system contracts
        run: bunx vitest run src/__tests__/pvSystemContracts.test.ts

      # B6 (auditoria 2026-06-29): as suites de conversão de unidade (dm²→física,
      # cm↔m, kg…) ficavam SÓ no cron semanal. Sendo a causa nº 1 de bug 100× de
      # consumo/custo, têm que travar merge — rodam aqui também (a weekly fica de
      # redundância).
      - name: Unit conversion suite (dm²→física etc.)
        run: bun run test:units

      - name: TypeScript type check
        # ⚠ tem que ser -p tsconfig.app.json: o tsconfig.json raiz é solution file
        # (files:[], só references) e NÃO checa nada. `bunx tsc --noEmit` na raiz
        # passa sempre → símbolo indefinido / import errado vira ReferenceError em prod.
        run: bunx tsc -p tsconfig.app.json --noEmit

      # A dívida histórica continua visível em `bun run lint`; este gate impede
      # que novos erros entrem enquanto os existentes são removidos por ondas.
      - name: ESLint regression gate
        env:
          LINT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun run lint:baseline

      - name: Design tokens check
        run: bash scripts/check-design-tokens.sh
        continue-on-error: true

      - name: Build production bundle
        run: bun run build

      - name: Branding Check
        id: branding_check
        run: bun run verify:no-branding

      - name: Verify and Upload Branding Report
        if: always() && steps.branding_check.outcome != 'skipped'
        run: |
          if [ -f "reports/branding-violations.json" ]; then
            # Only upload if the file exists and is not an empty JSON array
            SIZE=$(stat -c%s "reports/branding-violations.json")
            if [ "$SIZE" -gt 2 ]; then
              echo "Branding violations found. Uploading report..."
            else
              echo "No violations found (empty report). Skipping upload."
              rm reports/branding-violations.json
            fi
          else
            echo "Branding report not found."
          fi

      - name: Upload Artifact
        if: always() && hashFiles('reports/branding-violations.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: branding-report
          path: reports/branding-violations.json
          if-no-files-found: ignore
