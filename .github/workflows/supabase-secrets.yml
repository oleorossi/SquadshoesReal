name: Supabase — Sync Edge Function Secrets

# ─────────────────────────────────────────────────────────────────────────────
# Grava os secrets das Edge Functions (tokens da API ClickNotas) no projeto
# Supabase a partir dos Secrets do GitHub. Rodar sempre que os tokens forem
# regenerados em https://clicknotas.com/integracao_api/configuracoes/gerar_token.
#
# Trigger: manual (Actions tab > Run workflow) ou `gh workflow run`.
#
# Pré-requisitos (settings repo > Secrets and variables > Actions > Secrets):
#   SUPABASE_ACCESS_TOKEN    → PAT do Supabase (mesmo do supabase-migrate.yml)
#   SUPABASE_PROJECT_ID      → ssvxfoybzmjlypnipqzn
#   CLICKNOTAS_ACCESS_TOKEN  → Access Token gerado no painel ClickNotas
#   CLICKNOTAS_SECRET_TOKEN  → Secret Access Token gerado no painel ClickNotas
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

concurrency:
  group: supabase-secrets
  cancel-in-progress: false

jobs:
  sync-secrets:
    name: Push ClickNotas tokens to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate secrets
        env:
          SUPABASE_ACCESS_TOKEN:   ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID:     ${{ secrets.SUPABASE_PROJECT_ID }}
          CLICKNOTAS_ACCESS_TOKEN: ${{ secrets.CLICKNOTAS_ACCESS_TOKEN }}
          CLICKNOTAS_SECRET_TOKEN: ${{ secrets.CLICKNOTAS_SECRET_TOKEN }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN não configurado em Secrets}"
          : "${SUPABASE_PROJECT_ID:?SUPABASE_PROJECT_ID não configurado em Secrets}"
          : "${CLICKNOTAS_ACCESS_TOKEN:?CLICKNOTAS_ACCESS_TOKEN não configurado em Secrets}"
          : "${CLICKNOTAS_SECRET_TOKEN:?CLICKNOTAS_SECRET_TOKEN não configurado em Secrets}"
          echo "✓ Secrets presentes"

      # Tokens entram via env: (não interpolados no script) — interpolação
      # ${{ }} inline no run: corrompe silenciosamente token com $/"/` (bash
      # expande antes de executar) e o run fica verde com valor truncado.
      - name: Set edge function secrets
        env:
          SUPABASE_ACCESS_TOKEN:   ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID:     ${{ secrets.SUPABASE_PROJECT_ID }}
          CLICKNOTAS_ACCESS_TOKEN: ${{ secrets.CLICKNOTAS_ACCESS_TOKEN }}
          CLICKNOTAS_SECRET_TOKEN: ${{ secrets.CLICKNOTAS_SECRET_TOKEN }}
        run: |
          supabase secrets set \
            CLICKNOTAS_ACCESS_TOKEN="$CLICKNOTAS_ACCESS_TOKEN" \
            CLICKNOTAS_SECRET_TOKEN="$CLICKNOTAS_SECRET_TOKEN" \
            --project-ref "$SUPABASE_PROJECT_ID"
          echo "✅ Tokens gravados"

      - name: List secrets (nomes + digest, sem valores)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID:   ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase secrets list --project-ref "$SUPABASE_PROJECT_ID"
