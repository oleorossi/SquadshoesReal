name: Supabase — Apply Migrations

# ─────────────────────────────────────────────────────────────────────────────
# Aplica migrations em supabase/migrations/ no banco Supabase remoto.
#
# Triggers:
#   • workflow_dispatch        → manual, via GitHub UI (Actions tab > Run)
#                                Tem opção `dry_run: true` que só lista pendentes
#                                sem aplicar — recomendado pra primeira vez.
#   • push em main             → automático SOMENTE quando arquivos em
#                                supabase/migrations/** ou no próprio workflow
#                                mudarem. Outras alterações em main não disparam.
#
# Pré-requisitos (settings repo > Secrets and variables > Actions > Secrets):
#   SUPABASE_ACCESS_TOKEN   → personal access token
#                             criar em: https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    → senha do banco (Database > Settings > Reset password)
#   SUPABASE_PROJECT_ID     → ID do projeto (atual: ssvxfoybzmjlypnipqzn)
#
# Backlog: a primeira run pode tentar aplicar migrations que JÁ FORAM rodadas
# manualmente no SQL Editor. Migrations idempotentes (CREATE IF NOT EXISTS,
# DROP IF EXISTS, ON CONFLICT DO UPDATE) re-rodam sem efeito. Pra as não-
# idempotentes, marque como aplicadas ANTES da primeira run com:
#   supabase migration repair --status applied <YYYYMMDDHHMMSS>
# Ver scripts/repair-applied-migrations.sh.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Apenas listar pendentes (sem aplicar)?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrate.yml'

# Cancela runs antigas se uma nova começar (evita race ao rebase rápido)
concurrency:
  group: supabase-migrate
  cancel-in-progress: false # NÃO cancelar — aplicar migrations no meio é pior

jobs:
  migrate:
    name: Apply migrations to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID:  ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN não configurado em Secrets}"
          : "${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD não configurado em Secrets}"
          : "${SUPABASE_PROJECT_ID:?SUPABASE_PROJECT_ID não configurado em Secrets}"
          echo "✓ Secrets presentes"

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Show migration status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "═══════════════════════════════════════════"
          echo "  Migration status (local vs remote)"
          echo "═══════════════════════════════════════════"
          supabase migration list --linked || true

      - name: Dry run — skip apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: |
          echo "🟡 DRY RUN — nenhuma migration foi aplicada."
          echo "Revise a lista acima e rode novamente com dry_run=false pra aplicar."

      - name: Apply pending migrations
        if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🟢 Aplicando migrations pendentes..."
          supabase db push --linked
          echo "✅ Concluído"

      - name: Final status
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "═══════════════════════════════════════════"
          echo "  Status final"
          echo "═══════════════════════════════════════════"
          supabase migration list --linked || true
