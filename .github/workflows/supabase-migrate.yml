name: Supabase — Apply Migrations

# ─────────────────────────────────────────────────────────────────────────────
# Aplica somente migrations posteriores ao cutover canônico no banco remoto.
# O histórico legado é buscado em um workdir temporário e nunca é reexecutado.
#
# Triggers:
#   • workflow_dispatch        → manual, via GitHub UI (Actions tab > Run)
#                                Tem opção `dry_run: true` que executa o dry-run
#                                real da CLI sem aplicar.
#   • CI concluída em main     → automático somente quando o gate integral passa.
#                                Rodar sem migration pendente é um no-op seguro.
#
# Pré-requisitos (settings repo > Secrets and variables > Actions > Secrets):
#   SUPABASE_DB_PASSWORD    → senha do Postgres do projeto VIVO cknbzfqvqwqdhajspazn
#                             (Database > Settings > Reset database password)
#
# Project ref e pooler são FIXOS neste workflow (cknb / aws-1-sa-east-1).
# Em 16/11/2026 a produção (VITE_SUPABASE_URL) foi trocada do ssvx
# (us-west-2, conta Supabase antiga) para o cknb (sa-east-1, org gerenciada
# pelo Vercel), com recópia dos dados. O ssvx fica só como cópia de reserva e
# NÃO deve mais receber migrations. A guarda abaixo aborta se o ref/pooler
# não forem os do cknb.
#
# Conexão: direto no Postgres via pooler Supavisor em modo sessão (porta 5432,
# usuário postgres.<project_ref>, sslmode=require), com `--db-url`/psql.
# NÃO usa personal access token nem Management API.
#
# Cutover: migrations até 20270101009300 vêm exclusivamente do snapshot remoto
# validado. O workflow só acrescenta ao workdir arquivos locais posteriores a
# esse carimbo, impedindo que o backlog legado seja reaplicado.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validar migrations pendentes sem aplicar?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
# Cancela runs antigas se uma nova começar (evita race ao rebase rápido)
concurrency:
  group: supabase-migrate
  cancel-in-progress: false # NÃO cancelar — aplicar migrations no meio é pior

jobs:
  migrate:
    name: Apply migrations to Supabase
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    env:
      SUPABASE_MIGRATION_CUTOFF: '20270101009300'
      # Fixos no banco vivo do app (VITE_SUPABASE_URL = cknb desde 16/11/2026).
      SUPABASE_PROJECT_ID: 'cknbzfqvqwqdhajspazn'
      SUPABASE_DB_POOLER_HOST: 'aws-1-sa-east-1.pooler.supabase.com'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Validate secrets
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          : "${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD não configurado em Secrets}"
          # Guarda: só o banco vivo cknb (sa-east-1). Nunca o ssvx (reserva).
          if [ "${SUPABASE_PROJECT_ID}" != "cknbzfqvqwqdhajspazn" ] \
             || [ "${SUPABASE_DB_POOLER_HOST}" != "aws-1-sa-east-1.pooler.supabase.com" ]; then
            echo "❌ Projeto/pooler inesperado (${SUPABASE_PROJECT_ID} @ ${SUPABASE_DB_POOLER_HOST}); abortando." >&2
            exit 1
          fi
          echo "✓ Senha presente (projeto fixo ${SUPABASE_PROJECT_ID} @ ${SUPABASE_DB_POOLER_HOST})"

      - name: Build database connection URL
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          encoded_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          echo "::add-mask::${encoded_password}"
          db_url="postgresql://postgres.${SUPABASE_PROJECT_ID}:${encoded_password}@${SUPABASE_DB_POOLER_HOST}:5432/postgres?sslmode=require"
          echo "::add-mask::${db_url}"
          echo "SUPABASE_DB_URL=${db_url}" >> "${GITHUB_ENV}"
          echo "✓ URL de conexão montada (pooler ${SUPABASE_DB_POOLER_HOST}, modo sessão)"

      - name: Check database connectivity
        run: |
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 'conectado: ' || current_user || ' @ ' || current_database() || ' (' || split_part(version(), ' ', 2) || ')'"
          # O usuário do pooler carrega o ref do projeto: confirma que é o cknb.
          case "${SUPABASE_DB_URL}" in
            *"postgres.cknbzfqvqwqdhajspazn:"*) echo "✓ Conectado ao cknb" ;;
            *) echo "❌ URL não aponta para o cknb; abortando." >&2; exit 1 ;;
          esac

      - name: Validate local migration cutover
        run: |
          bun scripts/check-supabase-migration-cutover.mjs local supabase/migrations

      - name: Prepare isolated migration workdir
        run: |
          migration_workdir="${RUNNER_TEMP}/supabase-migration-cutover"
          if [[ -e "${migration_workdir}" ]]; then
            echo "Workdir temporário já existe; recusando reutilização: ${migration_workdir}" >&2
            exit 1
          fi
          mkdir -p "${migration_workdir}/supabase/migrations"
          cp supabase/config.toml "${migration_workdir}/supabase/config.toml"
          echo "SUPABASE_MIGRATION_WORKDIR=${migration_workdir}" >> "${GITHUB_ENV}"

      - name: Fetch and validate remote migration snapshot
        run: |
          supabase --workdir "${SUPABASE_MIGRATION_WORKDIR}" migration fetch \
            --db-url "${SUPABASE_DB_URL}" \
            --yes
          bun scripts/check-supabase-migration-cutover.mjs remote \
            "${SUPABASE_MIGRATION_WORKDIR}/supabase/migrations"

      - name: Stage post-cutover local migrations
        shell: bash
        run: |
          destination="${SUPABASE_MIGRATION_WORKDIR}/supabase/migrations"
          copied=0
          already_remote=0

          while IFS= read -r -d '' source; do
            filename="${source##*/}"
            if [[ ! "${filename}" =~ ^([0-9]{14})_.+\.sql$ ]]; then
              echo "Migration local com nome inválido: ${filename}" >&2
              exit 1
            fi

            version="${BASH_REMATCH[1]}"
            if [[ "${version}" > "${SUPABASE_MIGRATION_CUTOFF}" ]]; then
              shopt -s nullglob
              remote_matches=("${destination}/${version}_"*.sql)
              shopt -u nullglob

              if (( ${#remote_matches[@]} > 1 )); then
                echo "Snapshot remoto possui timestamp duplicado: ${version}" >&2
                exit 1
              fi

              if (( ${#remote_matches[@]} == 1 )); then
                remote_basename="${remote_matches[0]##*/}"
                if [[ "${remote_basename}" != "${filename}" ]]; then
                  echo "Conflito no timestamp ${version}: remoto=${remote_basename}, local=${filename}" >&2
                  exit 1
                fi
                echo "Já registrada no remoto: ${filename}"
                already_remote=$((already_remote + 1))
                continue
              fi

              cp -- "${source}" "${destination}/${filename}"
              echo "Preparada para deploy: ${filename}"
              copied=$((copied + 1))
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0)

          echo "Migrations novas preparadas: ${copied}"
          echo "Migrations pós-cutover já remotas: ${already_remote}"

      - name: Show migration status
        run: |
          echo "═══════════════════════════════════════════"
          echo "  Migration status (local vs remote)"
          echo "═══════════════════════════════════════════"
          supabase --workdir "${SUPABASE_MIGRATION_WORKDIR}" migration list \
            --db-url "${SUPABASE_DB_URL}" \
            --yes

      - name: Dry run pending migrations
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: |
          supabase --workdir "${SUPABASE_MIGRATION_WORKDIR}" db push \
            --db-url "${SUPABASE_DB_URL}" \
            --include-all \
            --dry-run \
            --yes
          echo "🟡 DRY RUN concluído — nenhuma migration foi aplicada."

      - name: Apply pending migrations
        if: github.event_name == 'workflow_run' || github.event.inputs.dry_run == 'false'
        run: |
          echo "🟢 Aplicando migrations pendentes..."
          # O snapshot isolado contém o histórico remoto e somente as novas
          # locais pós-cutover. MCP pode registrar uma versão posterior antes
          # do CI; incluir as pendentes evita deixar lacunas nessa sequência.
          #
          # Rateio já aplicado sob 19200 (e reestampado localmente para 19900).
          # Sem repair, o push tenta recriar índices e falha com 42P07.
          #
          # 22600: db push aplica o SQL e falha com 42501 no INSERT em
          # schema_migrations. Bootstrap via psql (conexão direta) + repair —
          # padrão do stamp 19900.
          # 50600 via psql para o NOTICE do PV-00255 aparecer no log do Actions.
          for stamp in 20270101022600 20270101050600; do
            shopt -s nullglob
            matches=("${SUPABASE_MIGRATION_WORKDIR}/supabase/migrations/${stamp}_"*.sql)
            shopt -u nullglob
            if (( ${#matches[@]} != 1 )); then
              continue
            fi
            sql_file="${matches[0]}"
            check_query="SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '${stamp}')"
            if ! present="$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -tAc "$check_query")"; then
              echo "Falha ao consultar schema_migrations para ${stamp}" >&2
              exit 1
            fi
            if [ "$present" = "t" ]; then
              echo "✓ ${stamp} já registrada em schema_migrations"
            else
              echo "↪ Aplicando ${stamp} via psql ($(basename "$sql_file"))"
              if ! psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 --single-transaction -f "$sql_file"; then
                echo "Falha ao aplicar ${stamp} via psql" >&2
                exit 1
              fi
              echo "✓ SQL de ${stamp} aplicado via psql"
            fi
          done

          # Stamps já aplicados no banco mas sem registro sob o carimbo local
          # (ou 46900 ainda pendente). Registro via psql — NÃO usar
          # `migration repair` (exige link/PAT; run 43770073904).
          for stamp in 20270101019200 20270101019900 20270101022600 20270101046900 20270101050600; do
            shopt -s nullglob
            matches=("${SUPABASE_MIGRATION_WORKDIR}/supabase/migrations/${stamp}_"*.sql)
            shopt -u nullglob
            if (( ${#matches[@]} != 1 )); then
              continue
            fi
            sql_file="${matches[0]}"
            stamp_name="$(basename "$sql_file" .sql | sed "s/^${stamp}_//")"
            check_query="SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '${stamp}')"
            if ! present="$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -tAc "$check_query")"; then
              echo "Falha ao consultar schema_migrations para ${stamp}" >&2
              exit 1
            fi
            if [ "$present" = "t" ]; then
              echo "✓ ${stamp} já registrada em schema_migrations"
              continue
            fi
            # 46900: SQL ainda não rodou no vivo — aplicar antes de registrar.
            if [ "$stamp" = "20270101046900" ]; then
              echo "↪ Aplicando ${stamp} via psql ($(basename "$sql_file"))"
              if ! psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 --single-transaction -f "$sql_file"; then
                echo "Falha ao aplicar ${stamp} via psql" >&2
                exit 1
              fi
            fi
            echo "↪ registrando ${stamp} em schema_migrations via psql"
            psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -c \
              "INSERT INTO supabase_migrations.schema_migrations (version, name, statements)
               VALUES ('${stamp}', '${stamp_name}', ARRAY[]::text[])
               ON CONFLICT (version) DO NOTHING"
            echo "✓ ${stamp} registrada"
          done

          supabase --workdir "${SUPABASE_MIGRATION_WORKDIR}" db push \
            --db-url "${SUPABASE_DB_URL}" \
            --include-all \
            --yes
          echo "✅ Concluído"

      - name: Verify SP124 post-deploy contract
        if: github.event_name == 'workflow_run' || github.event.inputs.dry_run == 'false'
        env:
          SQL_PATH: supabase/tests/sp124_composite_upper_guards_postdeploy.sql
        run: |
          test -f "$SQL_PATH" || { echo "Contrato pós-deploy ausente: $SQL_PATH" >&2; exit 1; }
          marker_query="SELECT EXISTS (SELECT 1 FROM public.deployment_postdeploy_checks WHERE check_key = '20270101014800_sp124_composite_upper_guards')"
          if ! verified="$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -tAc "$marker_query")"; then
            echo "Falha ao consultar marcador pós-deploy" >&2
            exit 1
          fi
          if [ "$verified" = "t" ]; then
            echo "✓ Contrato pós-deploy SP124 já foi aprovado; marcador durável encontrado."
            exit 0
          fi

          {
            cat "$SQL_PATH"
            cat <<'SQL'
          INSERT INTO public.deployment_postdeploy_checks (
            check_key,
            migration_version,
            details
          ) VALUES (
            '20270101014800_sp124_composite_upper_guards',
            '20270101014800',
            jsonb_build_object('verified_by', 'github-actions')
          )
          ON CONFLICT (check_key) DO UPDATE SET
            migration_version = EXCLUDED.migration_version,
            verified_at = pg_catalog.now(),
            details = EXCLUDED.details;
          SQL
          } > /tmp/sp124-postdeploy-with-marker.sql
          set +e
          # Sem --single-transaction: o contrato abre sua própria transação
          # READ ONLY; ON_ERROR_STOP impede o INSERT do marcador se falhar.
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 \
            -f /tmp/sp124-postdeploy-with-marker.sql > /tmp/sp124-postdeploy-output.txt 2>&1
          code=$?
          set -e
          echo "Pós-deploy SP124: psql exit $code"
          head -c 20000 /tmp/sp124-postdeploy-output.txt
          echo
          if [ "$code" -ne 0 ]; then
            echo "Contrato pós-deploy SP124 falhou; release bloqueado." >&2
            exit 1
          fi
          echo "✓ Contrato pós-deploy SP124 aprovado"

      - name: Final status
        if: always()
        run: |
          echo "═══════════════════════════════════════════"
          echo "  Status final"
          echo "═══════════════════════════════════════════"
          if [[ -n "${SUPABASE_MIGRATION_WORKDIR:-}" ]]; then
            supabase --workdir "${SUPABASE_MIGRATION_WORKDIR}" migration list \
              --db-url "${SUPABASE_DB_URL}" \
              --yes || true
          else
            echo "Workdir isolado não foi preparado."
          fi
