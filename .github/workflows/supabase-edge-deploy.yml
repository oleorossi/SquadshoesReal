name: Deploy Supabase Edge Functions

# Auto-deploy de Edge Functions quando arquivos em supabase/functions/** mudam em main.
# Roda em paralelo ao supabase-migrate.yml (migrations) e ao Vercel (frontend).
#
# Setup (uma vez):
# 1. Secrets já configurados (mesmos do supabase-migrate.yml):
#    - SUPABASE_ACCESS_TOKEN
#    - SUPABASE_PROJECT_ID
# 2. Para disparar manualmente: Actions tab → "Deploy Supabase Edge Functions" → Run workflow.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Função específica para deploy (vazio = todas alteradas)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # precisa do parent commit pra diff

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Detect changed functions
        id: detect
        run: |
          if [ -n "${{ inputs.function_name }}" ]; then
            echo "functions=${{ inputs.function_name }}" >> $GITHUB_OUTPUT
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD -- supabase/functions/)
            CHANGED=$(printf '%s\n' "$CHANGED_FILES" \
              | awk -F'/' '$3 != "_shared" {print $3}' \
              | sort -u)
            if printf '%s\n' "$CHANGED_FILES" | grep -q '^supabase/functions/_shared/'; then
              SHARED_CONSUMERS=$(
                printf '%s\n' "$CHANGED_FILES" \
                  | awk '/^supabase\/functions\/_shared\/.*\.ts$/' \
                  | while IFS= read -r shared_file; do
                      shared_import="../${shared_file#supabase/functions/}"
                      grep -rlF "$shared_import" supabase/functions --include='*.ts' || true
                    done \
                  | awk -F'/' '$3 != "_shared" {print $3}' \
                  | sort -u
              )
              CHANGED=$(printf '%s\n%s\n' "$CHANGED" "$SHARED_CONSUMERS" \
                | sed '/^$/d' | sort -u)
            fi
            CHANGED=$(printf '%s\n' "$CHANGED" | tr '\n' ' ')
            echo "functions=$CHANGED" >> $GITHUB_OUTPUT
            echo "Detected changed functions: $CHANGED"
          fi

      - name: Deploy each function
        if: steps.detect.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in ${{ steps.detect.outputs.functions }}; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "::group::Deploy $fn"
              # NÃO passar --no-verify-jwt aqui: o flag OVERRIDA o config.toml.
              # `--no-verify-jwt=false` forçava verify_jwt=TRUE em TODA função,
              # quebrando emit-nfe/nfe-status/recolor-image/time-control que
              # exigem verify_jwt=false (autenticam por conta própria). Sem o
              # flag, o CLI (setup-cli@latest) respeita [functions.<nome>]
              # verify_jwt do supabase/config.toml — fonte única da verdade.
              supabase functions deploy "$fn" \
                --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
              echo "::endgroup::"
            else
              echo "Skipping $fn (not a directory)"
            fi
          done
