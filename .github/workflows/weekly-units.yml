name: Weekly PV System & Unit Tests

# Roda conversões de unidade e a integração do sistema de pedidos
# uma vez por semana — segunda-feira às 06:00 UTC (03:00 BRT).
# Também pode ser disparado manualmente pela aba Actions.
#
# Inclui os guards SQL, a paridade numérica TS×SQL e os contratos operacionais
# de PV. As suítes escrevem fixtures: use um projeto Supabase EXCLUSIVO de CI.
#
# Secrets obrigatórios:
#   SUPABASE_CI_URL               URL do projeto isolado de CI
#   SUPABASE_CI_PROJECT_ID        project ref do mesmo ambiente isolado
#   SUPABASE_CI_SERVICE_ROLE_KEY  service role desse projeto, nunca do browser
# Preparo, sincronização de migrations e prova: docs/PV_SYSTEM_CI_SETUP.md
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-pv-system-integration
  cancel-in-progress: false

jobs:
  units:
    name: PV System Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit-conversion test suites
        run: bun run test:units

      - name: TypeScript type check
        # ⚠ -p tsconfig.app.json obrigatório: a raiz é solution file e não checa nada.
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: Supabase integration — no skipped/zero cases
        env:
          # Nomes consumidos hoje por src/test/dbGuards.ts e pela paridade TS×SQL.
          # A service role existe apenas neste step do CI e nunca usa prefixo VITE_.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_CI_URL }}
          SUPABASE_CI_PROJECT_ID: ${{ secrets.SUPABASE_CI_PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_CI_SERVICE_ROLE_KEY }}
        run: bun scripts/run-pv-system-integration.mjs

      - name: Upload PV system integration report
        if: always() && hashFiles('reports/pv-system-integration.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pv-system-integration
          path: reports/pv-system-integration.json
          if-no-files-found: error
