name: Weekly Unit Conversion Tests

# Roda os testes de conversão de unidades (cm↔m, dm², kg, etc.)
# apenas uma vez por semana — segunda-feira às 06:00 UTC (03:00 BRT).
# Também pode ser disparado manualmente pela aba Actions.
#
# Inclui o guard de paridade SQL (consumptionService.parity.test.ts), que por
# padrão fica em describe.skip sem RUN_DB_INTEGRATION=1 — sem isso ele nunca
# rodava em lugar nenhum do CI (achado na revisão de bugs de 2026-07-01).
# Requer os mesmos secrets já cadastrados pro supabase-migrate.yml:
#   SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  units:
    name: Unit Conversion Suite
    runs-on: ubuntu-latest
    # Secrets mapeados em env porque o contexto `secrets` NÃO é aceito em
    # `if:` de step — usá-lo lá invalida o arquivo inteiro e gera um run
    # "failure 0s" a cada push em qualquer branch.
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit-conversion test suites
        run: bun run test:units

      - name: TypeScript type check
        # ⚠ -p tsconfig.app.json obrigatório: a raiz é solution file e não checa nada.
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: SQL parity guard (calculate_order_consumption ↔ ..._by_grade)
        if: env.SUPABASE_PROJECT_ID != '' && env.SUPABASE_DB_PASSWORD != ''
        env:
          RUN_DB_INTEGRATION: '1'
          PGHOST: db.${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGDATABASE: postgres
          PGSSLMODE: require
        run: bunx vitest run src/services/__tests__/consumptionService.parity.test.ts
