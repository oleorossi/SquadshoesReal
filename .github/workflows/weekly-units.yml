name: Weekly Unit Conversion Tests

# Roda os testes de conversão de unidades (cm↔m, dm², kg, etc.)
# apenas uma vez por semana — segunda-feira às 06:00 UTC (03:00 BRT).
# Também pode ser disparado manualmente pela aba Actions.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  units:
    name: Unit Conversion Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit-conversion test suites
        run: bun run test:units

      - name: TypeScript type check
        run: bunx tsc --noEmit
